features:
    - title: Site groups and timers
      body: >-
          Put sites into groups with a shared daily allowance. When the time runs
          out, those sites stay blocked until 6:00.
    - title: Allowed Sites and Sanctuary
      body: >-
          Keep work sites reachable. Sanctuary Mode locks the browser to only that
          list until the timer you set runs out.
    - title: Optional adult and gambling list
      body: >-
          Turn on a bundled host list when you want those sites blocked by default.
          Allowed Sites can still make an exception.
    - title: Tracker blocking
      body: >-
          The same privacy protections can block trackers, send a Global Privacy
          Control signal, and prefer encrypted connections.


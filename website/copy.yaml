privacy:
    title: Privacy policy
    updated: Last updated 23 August 2026
    callout:
        title: OpenFocusd does not collect your data.
        body: >-
            We do not operate a backend, do not have user accounts, and do not
            receive, sell, or analyze your browsing. Site lists, timers, and settings
            stay in your browser.
    sections:
        - title: Who we are
          paragraphs:
              - >-
                  OpenFocusd is an open-source browser extension. This page is the
                  project homepage and the privacy policy required by the Chrome Web
                  Store. Contact: [shanhui.dev@proton.me](mailto:shanhui.dev@proton.me).
        - title: What stays on your device
          paragraphs:
              - >-
                  To block sites and count time, the extension stores the following
                  locally with Chrome’s storage APIs:
          list:
              - Websites you add to groups, Allowed Sites, or Sanctuary
              - Daily time used and when that day resets
              - >-
                  Your settings, such as language, search engine, Global Privacy
                  Control, and the adult and gambling toggle
          after:
              - >-
                  Chrome treats that local browsing activity as user data even when it
                  never leaves the device. Uninstalling OpenFocusd deletes it.
        - title: What we do not do
          list:
              - We do not create accounts or ask for an email address
              - We do not run analytics or crash reporting
              - We do not sell data or use it for advertising
              - We do not receive feedback or breakage reports
        - title: Third-party lists (DuckDuckGo)
          paragraphs:
              - >-
                  Tracker blocking uses public lists and configuration hosted by
                  DuckDuckGo. The extension periodically downloads those files from
                  `staticcdn.duckduckgo.com`. Those downloads do not include your site
                  lists, timers, or history.
              - >-
                  If HTTPS upgrading is on, the extension may ask DuckDuckGo whether a
                  site supports HTTPS by sending a short hash of the hostname — not the
                  full address or the page content — to `duckduckgo.com`.
              - >-
                  You can choose DuckDuckGo or Brave Search for searches started from
                  the popup. Those searches go to the search engine you picked, not to
                  OpenFocusd.
        - title: Limited Use
          paragraphs:
              - >-
                  OpenFocusd complies with the Chrome Web Store User Data Policy,
                  including the Limited Use requirements. Any user data the extension
                  handles is used only to provide its stated features: website blocking,
                  daily timers, and on-device privacy protections. It is not used for
                  unrelated purposes, and it is not sold or transferred for advertising
                  or credit purposes.
        - title: Children
          paragraphs:
              - >-
                  OpenFocusd does not knowingly collect personal information from
                  children. Settings and site lists are stored only in the browser that
                  installed the extension.
        - title: Changes
          paragraphs:
              - >-
                  If this policy changes, we will update this page and the date above.
                  The current version will always live at
                  [https://zshanhui.github.io/openfocusd/#privacy](https://zshanhui.github.io/openfocusd/#privacy).

